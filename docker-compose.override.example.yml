services:
  taxi-web:
    build:
      context: .
    image: registry.dev.it59com.ru/taxi-platform/taxi-web:latest
    ports:
      - "5173:80"
    environment:
      # Default works when backend is published behind the same domain/path.
      # For a separate backend host set, for example:
      # VITE_API_BASE_URL=http://api.example.com/api/v1
      # VITE_WS_URL=ws://api.example.com/api/v1/ws
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
      - VITE_WS_URL=${VITE_WS_URL:-}
      - VITE_USE_MOCK_API=${VITE_USE_MOCK_API:-false}
      - VITE_YANDEX_MAPS_API_KEY=${VITE_YANDEX_MAPS_API_KEY:-}
